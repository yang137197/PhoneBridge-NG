<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">PhoneBridge NG v0.2 Android 四页线框</title>
  <desc id="desc">首页、配对会话、电脑详情和设置页的冻结候选线框。</desc>
  <defs>
    <style>
      .phone { fill:#F4F7FB; stroke:#BBC8D8; stroke-width:2; }
      .surface { fill:#FFFFFF; stroke:#D8E1EC; stroke-width:1.2; }
      .subtle { fill:#EDF4FC; stroke:#D8E1EC; stroke-width:1; }
      .primary { fill:#1769E0; }
      .danger { fill:#FFFFFF; stroke:#C43D4B; stroke-width:1.5; }
      .ink { fill:#172033; font-family:'Roboto','Noto Sans CJK SC','Microsoft YaHei UI',sans-serif; }
      .body { fill:#354154; font-family:'Roboto','Noto Sans CJK SC','Microsoft YaHei UI',sans-serif; }
      .muted { fill:#667487; font-family:'Roboto','Noto Sans CJK SC','Microsoft YaHei UI',sans-serif; }
      .blue { fill:#1769E0; font-family:'Roboto','Noto Sans CJK SC','Microsoft YaHei UI',sans-serif; }
      .green { fill:#16865B; font-family:'Roboto','Noto Sans CJK SC','Microsoft YaHei UI',sans-serif; }
      .red { fill:#C43D4B; font-family:'Roboto','Noto Sans CJK SC','Microsoft YaHei UI',sans-serif; }
      .white { fill:#FFFFFF; font-family:'Roboto','Noto Sans CJK SC','Microsoft YaHei UI',sans-serif; }
      .h1 { font-size:23px; font-weight:600; }
      .h2 { font-size:17px; font-weight:600; }
      .label { font-size:14px; font-weight:600; }
      .small { font-size:12px; }
      .tiny { font-size:10px; }
      .line { stroke:#D8E1EC; stroke-width:1; }
    </style>
  </defs>
  <rect width="1600" height="1020" fill="#E9EFF6"/>
  <text x="42" y="46" class="ink h1">PhoneBridge NG v0.2 · Android 线框冻结候选 r1</text>

  <!-- Home -->
  <g transform="translate(42 78)">
    <rect class="phone" width="340" height="820" rx="32"/>
    <text x="22" y="34" class="ink tiny">9:41</text>
    <text x="292" y="34" class="body tiny">● ▴ ▮</text>
    <text x="22" y="78" class="ink h1">PhoneBridge NG</text>
    <text x="296" y="78" class="body h2">⚙</text>
    <rect x="16" y="104" width="308" height="230" rx="18" fill="#E7F8FA" stroke="#C8EEF1"/>
    <circle cx="54" cy="145" r="24" fill="#C9F0F2"/>
    <path d="M40 148c8-9 20-9 28 0M45 154c5-5 13-5 18 0" fill="none" stroke="#109DA8" stroke-width="4" stroke-linecap="round"/>
    <text x="88" y="145" class="green h2">正在共享</text>
    <text x="88" y="166" class="muted small">电脑可访问手机文件</text>
    <rect class="surface" x="28" y="188" width="284" height="58" rx="12"/>
    <text x="46" y="211" class="muted tiny">共享目录</text>
    <text x="46" y="232" class="ink label">DCIM</text>
    <text x="286" y="224" class="body h2">›</text>
    <rect class="primary" x="28" y="260" width="284" height="48" rx="12"/>
    <text x="139" y="290" class="white label">停止共享</text>
    <rect class="surface" x="16" y="350" width="308" height="48" rx="12"/>
    <text x="126" y="380" class="blue label">配对新电脑</text>
    <text x="18" y="438" class="ink h2">已配对的电脑</text>
    <rect class="surface" x="16" y="454" width="308" height="78" rx="16"/>
    <rect x="30" y="470" width="46" height="46" rx="12" fill="#EDF4FC"/>
    <text x="43" y="500" class="body h2">▣</text>
    <text x="90" y="484" class="ink label">DESKTOP-YANG</text>
    <text x="90" y="507" class="muted small">安全模式</text>
    <circle cx="274" cy="482" r="5" fill="#16865B"/>
    <text x="286" y="486" class="green tiny">在线</text>
    <text x="294" y="516" class="body h2">›</text>
    <rect class="subtle" x="16" y="552" width="308" height="94" rx="16"/>
    <text x="34" y="578" class="ink label">权限卡片（仅条件显示）</text>
    <text x="34" y="599" class="muted small">权限满足后不继续占据首页主操作区。</text>
    <text x="34" y="625" class="blue label">允许文件访问</text>
    <line x1="16" y1="682" x2="324" y2="682" class="line"/>
    <text x="22" y="708" class="muted tiny">停止态替换：状态“共享已停止”，主按钮“开始共享”。</text>
    <text x="22" y="790" class="muted tiny">01 首页</text>
  </g>

  <!-- Pairing -->
  <g transform="translate(432 78)">
    <rect class="phone" width="340" height="820" rx="32"/>
    <text x="22" y="34" class="ink tiny">9:41</text>
    <text x="292" y="34" class="body tiny">● ▴ ▮</text>
    <text x="22" y="78" class="body h2">‹</text>
    <text x="62" y="78" class="ink h1">配对新电脑</text>
    <circle cx="170" cy="154" r="42" fill="#DDF5F7"/>
    <path d="M146 160c8-18 40-18 48 0" fill="none" stroke="#109DA8" stroke-width="5" stroke-linecap="round"/>
    <text x="52" y="226" class="ink h2">在电脑上输入此一次性配对码</text>
    <rect class="subtle" x="28" y="250" width="284" height="76" rx="16"/>
    <text x="56" y="300" class="blue" style="font-size:32px;font-weight:600;letter-spacing:5px">4827 1953</text>
    <text x="104" y="352" class="muted small">剩余 95 秒 · 已使用 0 / 5 次尝试</text>
    <rect class="surface" x="28" y="386" width="284" height="128" rx="16"/>
    <circle cx="170" cy="422" r="16" fill="none" stroke="#1769E0" stroke-width="4" stroke-dasharray="28 16"/>
    <text x="92" y="460" class="ink label">等待电脑提交配对请求</text>
    <text x="56" y="484" class="muted small">连接请求到达后，在手机上明确允许或拒绝。</text>
    <rect class="subtle" x="28" y="534" width="284" height="104" rx="16"/>
    <text x="46" y="562" class="ink label">批准状态（请求到达时）</text>
    <text x="46" y="584" class="body small">允许“DESKTOP-YANG”访问共享目录？</text>
    <text x="46" y="610" class="red label">拒绝</text>
    <text x="226" y="610" class="blue label">允许配对</text>
    <rect class="surface" x="28" y="672" width="284" height="46" rx="12"/>
    <text x="133" y="701" class="body label">关闭配对</text>
    <text x="22" y="790" class="muted tiny">02 配对会话 · 不增加二维码</text>
  </g>

  <!-- Computer details -->
  <g transform="translate(822 78)">
    <rect class="phone" width="340" height="820" rx="32"/>
    <text x="22" y="34" class="ink tiny">9:41</text>
    <text x="292" y="34" class="body tiny">● ▴ ▮</text>
    <text x="22" y="78" class="body h2">‹</text>
    <text x="62" y="78" class="ink h1">电脑详情</text>
    <rect class="surface" x="16" y="106" width="308" height="92" rx="16"/>
    <rect x="30" y="124" width="52" height="52" rx="12" fill="#EDF4FC"/>
    <text x="45" y="157" class="body h2">▣</text>
    <text x="96" y="139" class="ink label">DESKTOP-YANG</text>
    <circle cx="102" cy="164" r="5" fill="#16865B"/>
    <text x="116" y="168" class="green small">在线</text>
    <rect class="surface" x="16" y="218" width="308" height="316" rx="16"/>
    <text x="32" y="248" class="ink h2">访问模式</text>
    <circle cx="44" cy="284" r="10" fill="#FFFFFF" stroke="#667487" stroke-width="2"/>
    <text x="66" y="279" class="ink label">只读</text>
    <text x="66" y="299" class="muted small">仅浏览和下载</text>
    <rect x="28" y="324" width="284" height="78" rx="12" fill="#EDF4FC" stroke="#9AC0F5"/>
    <circle cx="44" cy="350" r="10" fill="#1769E0"/><circle cx="44" cy="350" r="4" fill="#FFFFFF"/>
    <text x="66" y="348" class="ink label">安全模式</text>
    <text x="66" y="372" class="muted small">允许新建，不覆盖已有文件</text>
    <circle cx="44" cy="442" r="10" fill="#FFFFFF" stroke="#667487" stroke-width="2"/>
    <text x="66" y="437" class="ink label">完全读写</text>
    <text x="66" y="457" class="muted small">允许覆盖和删除</text>
    <rect class="subtle" x="28" y="478" width="284" height="40" rx="10"/>
    <text x="42" y="502" class="muted small">更改后，Windows 需要重新连接。</text>
    <line x1="16" y1="600" x2="324" y2="600" class="line"/>
    <text x="18" y="628" class="red h2">危险操作</text>
    <rect class="danger" x="16" y="646" width="308" height="48" rx="12"/>
    <text x="137" y="676" class="red label">撤销访问</text>
    <text x="22" y="790" class="muted tiny">03 电脑详情</text>
  </g>

  <!-- Settings -->
  <g transform="translate(1212 78)">
    <rect class="phone" width="340" height="820" rx="32"/>
    <text x="22" y="34" class="ink tiny">9:41</text>
    <text x="292" y="34" class="body tiny">● ▴ ▮</text>
    <text x="22" y="78" class="body h2">‹</text>
    <text x="62" y="78" class="ink h1">设置</text>
    <rect class="surface" x="16" y="110" width="308" height="154" rx="16"/>
    <text x="34" y="142" class="ink h2">语言</text>
    <circle cx="44" cy="182" r="10" fill="#1769E0"/><circle cx="44" cy="182" r="4" fill="#FFFFFF"/>
    <text x="68" y="187" class="body label">简体中文</text>
    <circle cx="44" cy="228" r="10" fill="#FFFFFF" stroke="#667487" stroke-width="2"/>
    <text x="68" y="233" class="body label">English</text>
    <rect class="subtle" x="16" y="286" width="308" height="92" rx="16"/>
    <text x="34" y="316" class="ink label">语言行为</text>
    <text x="34" y="340" class="muted small">切换后当前界面受控刷新，并在重启后保持。</text>
    <text x="34" y="362" class="muted small">通知与对话框使用同一选择。</text>
    <text x="20" y="430" class="body small">本版本不提供主题选择。</text>
    <text x="22" y="790" class="muted tiny">04 设置</text>
  </g>

  <text x="42" y="936" class="ink h2">实现来源优先级</text>
  <text x="42" y="963" class="body small">控件与文案：本线框 + CONTROL_STATES.md + COPY_MAP.md；颜色与尺寸：VISUAL_TOKENS.md；PNG 仅作视觉气质参考。</text>
  <text x="42" y="988" class="muted small">静态稿不证明 Android API 26/36、字体放大、TalkBack、横屏或厂商系统渲染。</text>
</svg>
